<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洞穴巡测封控与补测台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="topline">
        <div>
          <h1 id="title">洞穴巡测封控与补测台</h1>
          <p class="lede" id="lede"></p>
        </div>
        <button class="secondary" id="refreshBtn">刷新数据</button>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="main"></main>
  </div>
  <div class="modal" id="modal" hidden>
    <form class="modal-card" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div class="form-grid" id="modalFields"></div>
      <div class="actions">
        <button type="submit">提交更正</button>
        <button type="button" class="ghost" id="modalCancel">取消</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
